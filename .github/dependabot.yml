# Dependabot version updates.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Commit messages follow Conventional Commits so they pass the commitlint check.
# `chore` and `ci` are skipped by git-cliff, so these bumps stay out of the changelog.

version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope" # -> chore(deps): … / chore(deps-dev): …

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
      include: "scope" # -> ci(deps): …
